<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Chat · Orbit</title><link rel="stylesheet" href="styles.css">\n</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">✦</div><span>orbit<span class="brand-dot">.</span></span></div>
    <button class="new-chat" id="newChat"><span>＋</span> New chat</button>
    <div class="side-label">YOUR SPACE</div>
    <div class="side-item active"><span>◌</span> Chat assistant</div>
    <div class="side-bottom"><div class="avatar">AS</div><div><b>Web Development Lab</b><small>Experiment 10 · Chatbot</small></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="mobile-brand">✦ orbit<span>.</span></div><div class="model-pill"><span class="spark">✦</span> Gemini AI <span class="chevron">⌄</span></div><button class="icon-button" id="clearChat" title="Clear conversation">↻</button></header>
    <section class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-orb">✦</div><p class="eyebrow">YOUR AI ASSISTANT</p>
        <h1>Where should we<br><span>begin?</span></h1><p class="welcome-copy">Ask anything, brainstorm ideas, or work through a problem. I'm here to help.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Explain how REST APIs work with a simple example."><span>⌘</span><b>Learn something</b><small>Explain a concept simply</small></button>
          <button class="suggestion" data-prompt="Give me 5 creative project ideas for a computer science student."><span>✧</span><b>Brainstorm ideas</b><small>Explore creative possibilities</small></button>
          <button class="suggestion" data-prompt="Help me create a realistic study plan for this week."><span>▤</span><b>Make a plan</b><small>Organize my next steps</small></button>
          <button class="suggestion" data-prompt="Write a friendly, professional email asking for a meeting."><span>↗</span><b>Write something</b><small>Draft text from a prompt</small></button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </section>
    <div class="composer-wrap"><form id="chatForm" class="composer"><textarea id="messageInput" rows="1" placeholder="Message Orbit…" aria-label="Your message"></textarea><button id="sendButton" type="submit" aria-label="Send message">↑</button></form><p class="disclaimer">AI can make mistakes. Check important information.</p></div>
  </main>
</div>
<script src="app.js"></script>
</body></html>
